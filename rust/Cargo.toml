[package]
name = "arka_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "arka_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
