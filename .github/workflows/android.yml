name: Build APK

# Build APK debug di setiap push ke main + bisa dijalankan manual dari tab
# Actions. Binary proot dan libarka_core.so sudah ada di jniLibs, jadi job ini
# memvalidasi kode Kotlin/Compose dan menghasilkan APK yang bisa dipasang.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Menyediakan cmdline-tools + menerima lisensi, lalu memasang paket yang
      # dibutuhkan build.gradle.kts (compileSdk 35, build-tools 35, NDK r27).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verifikasi signature APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(command -v apksigner || find /usr/local/lib/android/sdk \
            -path '*/35.0.0/apksigner' -type f 2>/dev/null | head -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" | tee apk-signature.txt
          else
            echo "apksigner tidak ditemukan; lewati verifikasi" >&2
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arka-agent-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Ringkasan
        if: always()
        run: |
          echo "### Hasil build" >> "$GITHUB_STEP_SUMMARY"
          ls -lh android/app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
