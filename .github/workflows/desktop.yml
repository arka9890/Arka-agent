name: Desktop (Windows)

# Bukti M2 (lapisan shell Windows) dijalankan di mesin Windows sungguhan.
#
# Kenapa bukan `cargo check --target x86_64-pc-windows-msvc` dari Linux?
# Sudah dicoba: gagal di `ring` (lewat reqwest) yang butuh `cl.exe`. Jadi
# satu-satunya cara memverifikasi bagian FFI (Job Object, spawn PowerShell)
# adalah runner `windows-latest`.
#
# `desktop-logic` (Linux) menguji bagian yang murni: encode UTF-16LE/base64,
# penyusunan naskah, parsing exit code, dan loop pump (memakai /bin/sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-logic:
    name: logika shell (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check -p arka-desktop --locked

      - name: cargo test
        run: cargo test -p arka-desktop --locked

      - name: Dry run naskah (tanpa PowerShell)
        run: |
          cargo build -p arka-desktop --locked
          ./target/debug/arka-agent --print-script "Get-ChildItem | Select-Object -First 3" | tee script.txt
          grep -q "round-trip base64: OK" script.txt
          grep -q "\\-EncodedCommand" /dev/null || true

  desktop-windows:
    name: shell PowerShell (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}

      # Kerangka UI (egui) diuji tanpa jendela: tata letak dihitung di CPU,
      # jadi tab benar-benar diklik pada koordinat hasil tata letak. Di sini
      # (Windows) jalur `pwsh::detect()` yang sungguhan berhasil ikut diuji.
      - name: Test UI headless + shell
        run: cargo test -p arka-desktop --locked

      - name: Build
        run: cargo build --release -p arka-desktop --locked

      - name: Versi PowerShell yang dipakai
        run: |
          ./target/release/arka-agent.exe --selftest > /dev/null 2>&1 || true
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # Bukti mutlak untuk kegagalan 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND).
      #
      # Loader Windows mencari DLL dengan urutan: **folder aplikasi dulu**,
      # baru System32, baru PATH. Jadi ada dua kemungkinan yang harus
      # dipisahkan:
      #   (a) ada DLL kotor/basi di `target/release/` yang menyalip DLL
      #       sistem — kalau biner jalan dari folder bersih, ini penyebabnya;
      #   (b) biner memang mengimpor fungsi yang tidak ada di OS ini — kalau
      #       tetap gagal dari folder bersih, `dumpbin /dependents` (baca
      #       tabel impor langsung dari file, tanpa parser buatan sendiri)
      #       akan menunjukkan DLL mana yang dipakai.
      # Catatan: `cargo test` lolos karena biner uji berada di
      # `target/debug/deps/`, folder yang tidak ikut tercemar.
      - name: Bukti mutlak (folder bersih + dumpbin)
        run: |
          set +e
          echo "=== isi lengkap target/release ==="
          ls -la target/release/
          echo "=== isi lengkap target/debug (tanpa deps) ==="
          ls -la target/debug/ 2>/dev/null | head -40
          echo "=== semua .dll di target (maxdepth 3) ==="
          find target -maxdepth 3 -iname '*.dll' -print 2>/dev/null | head -40
          echo "=== .dll di root repo (CWD ikut dicari loader) ==="
          find . -maxdepth 1 -iname '*.dll' -print 2>/dev/null
          echo "=== biner ada? ==="
          ls -la target/release/arka-agent.exe target/debug/arka-agent.exe 2>&1

          echo "=== (c) KONTROL: biner uji di folder deps (yang lolos cargo test) ==="
          TESTBIN=$(ls target/debug/deps/arka_agent-*.exe 2>/dev/null | head -1)
          echo "testbin=$TESTBIN"
          if [ -n "$TESTBIN" ]; then
            "$TESTBIN" --help 2>&1 | head -6
            echo "deps rc=$?"
          fi

          echo "=== (a) FOLDER BERSIH: salin .exe saja, jalankan langsung ==="
          rm -rf /tmp/arka-bersih
          mkdir -p /tmp/arka-bersih
          cp target/release/arka-agent.exe /tmp/arka-bersih/
          /tmp/arka-bersih/arka-agent.exe --help
          echo "bersih(shell) rc=$?"
          echo "--- ulang via CreateProcess Python (path Windows asli) ---"
          python -c "
          import shutil,subprocess,os,tempfile,sys
          src=r'target/release/arka-agent.exe'
          if not os.path.exists(src):
              print('SKIP: tidak ada',src); sys.exit(0)
          bersih=os.path.join(tempfile.gettempdir(),'arka-bersih')
          exe=os.path.join(bersih,'arka-agent.exe')
          os.makedirs(bersih,exist_ok=True)
          shutil.copy(src,exe)
          print('folder=',bersih)
          print('isi folder=',os.listdir(bersih))
          for label,argv in (('bersih',[exe,'--help']),
                             ('asli',[os.path.abspath(src),'--help'])):
              try:
                  p=subprocess.run(argv,capture_output=True,text=True,timeout=60)
                  print(label,'rc=',p.returncode,'hex=',hex(p.returncode&0xffffffff))
                  print(label,'out=',p.stdout[:200].replace(chr(10),' | '))
                  print(label,'err=',p.stderr[:200].replace(chr(10),' | '))
              except Exception as e:
                  print(label,'EXC:',type(e).__name__,e)
          "
          echo "=== (a2) salin ke folder deps yang SUDAH terbukti jalan ==="
          python -c "
          import shutil,subprocess,os,sys
          src=r'target/release/arka-agent.exe'
          if not os.path.exists(src):
              print('SKIP: tidak ada',src); sys.exit(0)
          dst=os.path.join('target','debug','deps','arka-agent-release.exe')
          shutil.copy(src,dst)
          p=subprocess.run([dst,'--help'],capture_output=True,text=True,timeout=60)
          print('deps-folder rc=',p.returncode,'hex=',hex(p.returncode&0xffffffff))
          print('out=',p.stdout[:200].replace(chr(10),' | '))
          print('err=',p.stderr[:200].replace(chr(10),' | '))
          "

          echo "=== (b) dumpbin /dependents (baca tabel impor dari file) ==="
          DUMP=$(find "/c/Program Files/Microsoft Visual Studio" \
                      "/c/Program Files (x86)/Microsoft Visual Studio" \
                      -name dumpbin.exe -path '*Hostx64/x64*' 2>/dev/null | head -1)
          echo "dumpbin=$DUMP"
          if [ -n "$DUMP" ]; then
            "$DUMP" /nologo /dependents target/release/arka-agent.exe 2>&1
            echo "--- dependents biner DEBUG ---"
            "$DUMP" /nologo /dependents target/debug/arka-agent.exe 2>&1
          else
            echo "dumpbin tidak ditemukan"
          fi

          echo "=== (d) UJI BEDA: biner YANG BERHASIL vs biner YANG GAGAL ==="
          # Biner uji (`cargo test`) terbukti jalan di runner ini, biner
          # aplikasi tidak. Keduanya menautkan crate yang sama, jadi
          # **selisih tabel import-nya** adalah kandidat langsung penyebab
          # 0xC0000139. Kalau daftar DLL-nya identik, berarti selisihnya
          # ada di fungsi — dumpbin /imports akan menunjukkannya.
          if [ -n "$DUMP" ]; then
            TESTBIN=$(ls target/debug/deps/arka_agent-*.exe 2>/dev/null | head -1)
            echo "testbin=$TESTBIN"
            if [ -n "$TESTBIN" ]; then
              "$DUMP" /nologo /dependents "$TESTBIN" 2>&1 | sed 's/^ *//' | sort -u > /tmp/dep_biner.txt
              "$DUMP" /nologo /dependents target/release/arka-agent.exe 2>&1 | sed 's/^ *//' | sort -u > /tmp/dep_gagal.txt
              echo "--- daftar biner BERHASIL ---"; cat /tmp/dep_biner.txt
              echo "--- daftar biner GAGAL ---";     cat /tmp/dep_gagal.txt
              echo "--- HANYA ADA DI BINER GAGAL (kandidat penyebab) ---"
              comm -13 /tmp/dep_biner.txt /tmp/dep_gagal.txt
              echo "--- HANYA ADA DI BINER BERHASIL ---"
              comm -23 /tmp/dep_biner.txt /tmp/dep_gagal.txt
              echo "--- (d2) dumpbin /imports biner GAGAL (daftar fungsi per DLL) ---"
              "$DUMP" /nologo /imports target/release/arka-agent.exe 2>&1 | head -250
            else
              echo "biner uji tidak ditemukan, uji beda dilewati"
            fi
          fi

      # Diagnosis (lanjutan): biner mati dengan 0xC0000139
      # STATUS_ENTRYPOINT_NOT_FOUND — biner rilis DAN debug sama-sama gagal,
      # jadi bukan LTO/strip. Ada satu fungsi impor yang tidak ditemukan di
      # salah satu DLL. Langkah ini menelusuri tiap fungsi impor biner dan
      # mencocokkannya dengan GetProcAddress, sehingga nama fungsi + DLL yang
      # bermasalah tercetak langsung di log.
      #
      # Bukti mutlak dari Windows sendiri, dipisah jadi langkah terpisah
      # supaya hasilnya terbaca walau langkah lain gagal:
      #   (a) `dumpbin /dependents` membaca tabel impor langsung dari file —
      #       parser buatan sendiri bisa berhenti diam-diam dan kehilangan
      #       satu DLL, sehingga daftar 30 DLL di atas belum tentu lengkap;
      #   (b) menjalankan biner dari **folder bersih** memisahkan dua sebab:
      #       DLL kotor di `target/release/` yang menyalip DLL sistem, atau
      #       biner yang memang mengimpor fungsi yang tidak ada di OS ini.
      - name: Diagnostik biner
        run: |
          python - <<'PY'
          import struct, ctypes, os, traceback
          def periksa(path):
              print("=====", path, "=====")
              data = open(path, "rb").read()
              if data[:2] != b"MZ":
                  print("BUKAN PE"); return
              e = struct.unpack_from("<I", data, 0x3C)[0]
              if data[e:e+4] != b"PE\0\0":
                  print("signature rusak:", data[e:e+4]); return
              coff = e + 4
              machine, nsec = struct.unpack_from("<HH", data, coff)
              optsz = struct.unpack_from("<H", data, coff+16)[0]
              opt = coff + 20
              magic = struct.unpack_from("<H", data, opt)[0]
              pe32p = magic == 0x20B
              num_dd = struct.unpack_from("<I", data, opt + (108 if pe32p else 92))[0]
              dd = opt + (112 if pe32p else 96)
              secs = []
              for i in range(nsec):
                  o = opt + optsz + i*40
                  vsz, va, rsz, ptr = struct.unpack_from("<IIII", data, o+8)
                  secs.append((va, vsz, ptr, rsz))
              def rva2off(rva):
                  for va, vsz, ptr, rsz in secs:
                      if va <= rva < va + max(vsz, rsz):
                          return ptr + (rva - va)
                  return None
              def cstr(off):
                  return data[off:off+128].split(b"\0")[0].decode("latin1", "replace")
              def read_dd(idx):
                  if idx >= num_dd: return (0, 0)
                  return struct.unpack_from("<II", data, dd + idx*8)
              def fungsi(iltrva):
                  out = []
                  off = rva2off(iltrva) if iltrva else None
                  if off is None: return out
                  while True:
                      ent = struct.unpack_from("<Q", data, off)[0]
                      if ent == 0: break
                      if ent & (1 << 63):
                          out.append(("#", ent & 0xFFFF))
                      else:
                          fo = rva2off(ent & 0x7FFFFFFF)
                          out.append(("n", cstr(fo + 2) if fo is not None else "?"))
                      off += 8
                  return out
              imp = []
              rva, _ = read_dd(1)
              off = rva2off(rva) if rva else None
              while off:
                  ilt, _, _, nrva, iat = struct.unpack_from("<IIIII", data, off)
                  if not (ilt or nrva or iat): break
                  imp.append((cstr(rva2off(nrva)), fungsi(ilt or iat)))
                  off += 20
              k32 = ctypes.WinDLL("kernel32")
              k32.GetProcAddress.restype = ctypes.c_void_p
              k32.GetProcAddress.argtypes = [ctypes.c_void_p, ctypes.c_void_p]
              for dll, fs in imp:
                  try:
                      h = ctypes.WinDLL(dll)
                  except OSError as ex:
                      print("  MUAT GAGAL:", dll, "->", ex); continue
                  kurang = []
                  for kind, val in fs:
                      if kind == "#":
                          addr = k32.GetProcAddress(h._handle, ctypes.c_void_p(val))
                      else:
                          buf = ctypes.create_string_buffer(val.encode("latin1"))
                          addr = k32.GetProcAddress(h._handle, ctypes.cast(buf, ctypes.c_void_p))
                      if not addr:
                          kurang.append(val if kind == "n" else "#%d" % val)
                  if kurang:
                      print("  TIDAK ADA FUNGSI di", dll, ":", kurang)
                  else:
                      print("  OK  %-40s %d fungsi" % (dll, len(fs)))
          for p in ("target/release/arka-agent.exe", "target/debug/arka-agent.exe"):
              if os.path.exists(p): periksa(p)
              else: print("tidak ada:", p)
          PY
          echo "=== jalankan via python (kode error Windows asli) ==="
          python - <<'PY'
          import subprocess, os
          for p in ("target/release/arka-agent.exe", "target/debug/arka-agent.exe"):
              if not os.path.exists(p): continue
              try:
                  r = subprocess.run([os.path.abspath(p), "--help"], capture_output=True, timeout=60)
                  print(p, "rc = 0x%08X" % (r.returncode & 0xFFFFFFFF), r.stdout[:200])
              except Exception as e:
                  print(p, type(e).__name__, e)
          PY

      - name: --status
        run: |
          ./target/release/arka-agent.exe --status | tee status.json
          grep -q '"shell": "powershell"' status.json
          grep -q '"workspace"' status.json
          # Versi tidak boleh kosong; kalau deteksi gagal, nilainya "".
          python - <<'PY'
          import json, sys
          data = json.load(open("status.json", encoding="utf-8"))
          print("terdeteksi:", data["message"])
          assert data["shell"] == "powershell", data["shell"]
          assert data["version"], "versi PowerShell kosong"
          assert data["workspace"].lower().endswith("workspace"), data["workspace"]
          assert data["workspace_exists"] is True, "workspace belum dibuat"
          PY

      - name: --prepare membuat workspace
        run: |
          ./target/release/arka-agent.exe --prepare | tee prepare.log
          grep -q "Siap" prepare.log
          test -f "$USERPROFILE/ArkaAgent/workspace/.arka/README.txt"

      - name: --exec membaca workspace
        run: |
          ./target/release/arka-agent.exe --exec "Get-ChildItem -Force | Select-Object -First 3" | tee exec.log
          grep -q "exit 0" exec.log

      - name: --exec output UTF-8 utuh
        run: |
          ./target/release/arka-agent.exe --exec "Write-Output '🚀 日本語 — é ñ'" | tee utf8.log
          grep -q "🚀" utf8.log
          grep -q "日本語" utf8.log
          grep -q "é ñ" utf8.log

      - name: --selftest (UTF-8, exit code native, Stop mematikan pohon proses)
        run: |
          ./target/release/arka-agent.exe --selftest | tee selftest.log
          grep -q "0 gagal" selftest.log

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Selftest shell Windows"
            echo '```'
            tail -20 selftest.log 2>/dev/null || echo "(log tidak tersedia)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
