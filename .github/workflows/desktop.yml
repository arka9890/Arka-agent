name: Desktop (Windows)

# Bukti M2 (lapisan shell Windows) dijalankan di mesin Windows sungguhan.
#
# Kenapa bukan `cargo check --target x86_64-pc-windows-msvc` dari Linux?
# Sudah dicoba: gagal di `ring` (lewat reqwest) yang butuh `cl.exe`. Jadi
# satu-satunya cara memverifikasi bagian FFI (Job Object, spawn PowerShell)
# adalah runner `windows-latest`.
#
# `desktop-logic` (Linux) menguji bagian yang murni: encode UTF-16LE/base64,
# penyusunan naskah, parsing exit code, dan loop pump (memakai /bin/sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-logic:
    name: logika shell (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check -p arka-desktop --locked

      - name: cargo test
        run: cargo test -p arka-desktop --locked

      - name: Dry run naskah (tanpa PowerShell)
        run: |
          cargo build -p arka-desktop --locked
          ./target/debug/arka-agent --print-script "Get-ChildItem | Select-Object -First 3" | tee script.txt
          grep -q "round-trip base64: OK" script.txt
          grep -q "\\-EncodedCommand" /dev/null || true

  desktop-windows:
    name: shell PowerShell (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}

      # Kerangka UI (egui) diuji tanpa jendela: tata letak dihitung di CPU,
      # jadi tab benar-benar diklik pada koordinat hasil tata letak. Di sini
      # (Windows) jalur `pwsh::detect()` yang sungguhan berhasil ikut diuji.
      - name: Test UI headless + shell
        run: cargo test -p arka-desktop --locked

      - name: Build
        run: cargo build --release -p arka-desktop --locked

      - name: Versi PowerShell yang dipakai
        run: |
          ./target/release/arka-agent.exe --selftest > /dev/null 2>&1 || true
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # Diagnosis: `--status` pernah gagal dengan exit 127 dalam <100 ms tanpa
      # output satu byte pun — `--help` pun ikut 127, padahal biner debug lolos
      # tes. Artinya biner rilis gagal dimuat SEBELUM `main` (kemungkinan DLL
      # impor hilang atau PE rusak akibat LTO/strip). Langkah ini memeriksa
      # header PE, mencocokkan tiap DLL impor dengan file yang benar-benar ada,
      # lalu menjalankan biner lewat Python supaya kode error Windows asli
      # (bukan penerjemahan bash) terlihat, dan membandingkannya dengan debug.
      - name: Diagnostik biner
        run: |
          ls -la target/release/arka-agent.exe
          python - <<'PY'
          import struct, os
          path = "target/release/arka-agent.exe"
          data = open(path, "rb").read()
          print("size =", len(data))
          if data[:2] != b"MZ":
              print("BUKAN PE, header =", data[:8]); raise SystemExit
          e = struct.unpack_from("<I", data, 0x3C)[0]
          print("signature =", data[e:e+4])
          if data[e:e+4] != b"PE\0\0":
              raise SystemExit("signature PE tidak valid")
          coff = e + 4
          machine, nsec = struct.unpack_from("<HH", data, coff)
          optsz = struct.unpack_from("<H", data, coff+16)[0]
          opt = coff + 20
          magic = struct.unpack_from("<H", data, opt)[0]
          pe32p = magic == 0x20B
          print("machine = 0x%04X  magic = 0x%04X  nsec = %d" % (machine, magic, nsec))
          num_dd = struct.unpack_from("<I", data, opt + (108 if pe32p else 92))[0]
          dd = opt + (112 if pe32p else 96)
          secs = []
          for i in range(nsec):
              o = opt + optsz + i*40
              vsz, va, rsz, ptr = struct.unpack_from("<IIII", data, o+8)
              secs.append((va, vsz, ptr, rsz))
          def rva2off(rva):
              for va, vsz, ptr, rsz in secs:
                  if va <= rva < va + max(vsz, rsz):
                      return ptr + (rva - va)
              return None
          def cstr(off):
              return data[off:off+80].split(b"\0")[0].decode("latin1", "replace")
          def read_dd(idx):
              if idx >= num_dd: return (0, 0)
              return struct.unpack_from("<II", data, dd + idx*8)
          dlls = []
          rva, _ = read_dd(1)
          off = rva2off(rva) if rva else None
          while off:
              ilt, _, _, nrva, iat = struct.unpack_from("<IIIII", data, off)
              if not (ilt or nrva or iat): break
              no = rva2off(nrva)
              if no is None: break
              dlls.append(cstr(no))
              off += 20
          print("DLL impor (%d):" % len(dlls))
          for d in dlls: print("   ", d)
          rva, _ = read_dd(13)
          off = rva2off(rva) if rva else None
          delay = []
          while off:
              attrs, name_rva = struct.unpack_from("<II", data, off)
              if not name_rva: break
              no = rva2off(name_rva)
              if no is None: break
              delay.append(cstr(no))
              off += 32
          if delay: print("delay-load:", delay)
          win = os.environ.get("SystemRoot", r"C:\Windows")
          dirs = [os.getcwd(), os.path.join(win, "System32"), os.path.join(win, "SysWOW64")]
          dirs += [p for p in os.environ.get("PATH", "").split(os.pathsep) if p]
          for d in dlls + delay:
              hit = next((os.path.join(b, d) for b in dirs
                          if b and os.path.exists(os.path.join(b, d))), None)
              print(("  OK      " if hit else "  HILANG  ") + d, "->", hit or "-")
          PY
          python - <<'PY'
          import subprocess, os
          path = os.path.abspath("target/release/arka-agent.exe")
          for args in (["--help"], ["--status"]):
              try:
                  p = subprocess.run([path] + args, capture_output=True, timeout=60)
                  print(args, "rc =", p.returncode)
                  print("   stdout:", p.stdout[:900])
                  print("   stderr:", p.stderr[:900])
              except OSError as e:
                  print(args, "OSError winerror =", getattr(e, "winerror", None), e)
              except Exception as e:
                  print(args, type(e).__name__, e)
          PY
          echo "=== perbandingan debug ==="
          (cargo build -p arka-desktop --locked 2>&1 | tail -3) || true
          ./target/debug/arka-agent.exe --help > debug-help.txt 2>&1 || echo "debug exit=$?"
          head -5 debug-help.txt

      - name: --status
        run: |
          ./target/release/arka-agent.exe --status | tee status.json
          grep -q '"shell": "powershell"' status.json
          grep -q '"workspace"' status.json
          # Versi tidak boleh kosong; kalau deteksi gagal, nilainya "".
          python - <<'PY'
          import json, sys
          data = json.load(open("status.json", encoding="utf-8"))
          print("terdeteksi:", data["message"])
          assert data["shell"] == "powershell", data["shell"]
          assert data["version"], "versi PowerShell kosong"
          assert data["workspace"].lower().endswith("workspace"), data["workspace"]
          assert data["workspace_exists"] is True, "workspace belum dibuat"
          PY

      - name: --prepare membuat workspace
        run: |
          ./target/release/arka-agent.exe --prepare | tee prepare.log
          grep -q "Siap" prepare.log
          test -f "$USERPROFILE/ArkaAgent/workspace/.arka/README.txt"

      - name: --exec membaca workspace
        run: |
          ./target/release/arka-agent.exe --exec "Get-ChildItem -Force | Select-Object -First 3" | tee exec.log
          grep -q "exit 0" exec.log

      - name: --exec output UTF-8 utuh
        run: |
          ./target/release/arka-agent.exe --exec "Write-Output '🚀 日本語 — é ñ'" | tee utf8.log
          grep -q "🚀" utf8.log
          grep -q "日本語" utf8.log
          grep -q "é ñ" utf8.log

      - name: --selftest (UTF-8, exit code native, Stop mematikan pohon proses)
        run: |
          ./target/release/arka-agent.exe --selftest | tee selftest.log
          grep -q "0 gagal" selftest.log

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Selftest shell Windows"
            echo '```'
            tail -20 selftest.log 2>/dev/null || echo "(log tidak tersedia)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
