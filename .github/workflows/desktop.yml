name: Desktop (Windows)

# Bukti M2 (lapisan shell Windows) dijalankan di mesin Windows sungguhan.
#
# Kenapa bukan `cargo check --target x86_64-pc-windows-msvc` dari Linux?
# Sudah dicoba: gagal di `ring` (lewat reqwest) yang butuh `cl.exe`. Jadi
# satu-satunya cara memverifikasi bagian FFI (Job Object, spawn PowerShell)
# adalah runner `windows-latest`.
#
# `desktop-logic` (Linux) menguji bagian yang murni: encode UTF-16LE/base64,
# penyusunan naskah, parsing exit code, dan loop pump (memakai /bin/sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-logic:
    name: logika shell (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check -p arka-desktop --locked

      - name: cargo test
        run: cargo test -p arka-desktop --locked

      - name: Dry run naskah (tanpa PowerShell)
        run: |
          cargo build -p arka-desktop --locked
          ./target/debug/arka-agent --print-script "Get-ChildItem | Select-Object -First 3" | tee script.txt
          grep -q "round-trip base64: OK" script.txt
          grep -q "\\-EncodedCommand" /dev/null || true

  desktop-windows:
    name: shell PowerShell (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}

      # Kerangka UI (egui) diuji tanpa jendela: tata letak dihitung di CPU,
      # jadi tab benar-benar diklik pada koordinat hasil tata letak. Di sini
      # (Windows) jalur `pwsh::detect()` yang sungguhan berhasil ikut diuji.
      - name: Test UI headless + shell
        run: cargo test -p arka-desktop --locked

      - name: Build
        run: cargo build --release -p arka-desktop --locked

      - name: Versi PowerShell yang dipakai
        run: |
          ./target/release/arka-agent.exe --selftest > /dev/null 2>&1 || true
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # Bukti mutlak untuk 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND).
      #
      # Hasil run sebelumnya (76fb2fa) sudah mematikan dua dugaan:
      #   * folder bersih (hanya .exe) tetap gagal -> BUKAN DLL kotor;
      #   * tidak ada satu pun .dll di target/ maupun root repo;
      #   * GetProcAddress di proses Python bilang semua fungsi ada, tapi
      #     itu memakai DLL yang sudah termuat di proses Python, bukan
      #     konteks loader biner;
      #   * `dumpbin` TIDAK PERNAH jalan: Git Bash mengubah `/nologo`
      #     jadi `C:\Program Files\Git\nologo`.
      #
      # Dua langkah yang benar-benar menentukan:
      #   (1) `dumpbin` dipanggil lewat **Python** (tanpa konversi path
      #       MSYS) sehingga membaca tabel impor langsung dari file —
      #       daftar DLL + daftar fungsi per DLL, termasuk bagian
      #       delay-load yang tidak dicek parser sebelumnya;
      #   (2) bangun **biner debug aplikasi** lalu jalankan `--help`.
      #       Selama ini yang diuji hanya biner rilis dan biner uji.
      #       `cargo test` TIDAK menghasilkan `target/debug/arka-agent.exe`
      #       (hasilnya ada di `build/.../out/`), itulah sebabnya run lama
      #       melaporkan `exit=127` — file-nya memang tidak pernah ada.
      #       Biner uji lulus 156 test, jadi kode yang sama pada profil
      #       debug TERBUKTI jalan; kalau biner debug aplikasi juga jalan,
      #       selisihnya ada di profil rilis (lto/strip/opt-level).
      # Bukti mutlak untuk 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND).
      #
      # Hasil run 76fb2fa sudah mematikan tiga dugaan:
      #   * folder bersih (hanya .exe) tetap gagal -> BUKAN DLL kotor;
      #   * tidak ada satu pun .dll di target/ maupun root repo;
      #   * `dumpbin` TIDAK PERNAH jalan karena Git Bash mengubah
      #     `/nologo` jadi `C:\Program Files\Git\nologo`.
      #
      # Urutan di bawah sengaja: bangun biner debug DULU supaya ada bahan
      # untuk dibandingkan, baru dumpbin. Tiga bukti yang menentukan:
      #   (1) `cargo build` (debug) lalu jalankan `--help` — selama ini
      #       yang diuji hanya biner rilis; `cargo test` tidak pernah
      #       menghasilkan `target/debug/arka-agent.exe` (hasilnya ada di
      #       `build/.../out/`), itulah sebabnya run lama melaporkan
      #       `exit=127` — file-nya memang tidak pernah ada. Biner uji
      #       lulus 156 test, jadi kode sama pada profil debug terbukti
      #       jalan; kalau biner debug aplikasi ikut jalan, selisihnya ada
      #       di profil rilis (lto/strip/opt-level);
      #   (2) `dumpbin /dependents` dipanggil lewat Python (tanpa konversi
      #       path MSYS) -> daftar DLL resmi dari file, bukan dari proses
      #       Python yang sudah keburu memuat banyak DLL;
      #   (3) `dumpbin /imports` -> daftar fungsi per DLL **termasuk
      #       bagian delay-load**, yang tidak pernah dicek parser lama.
      - name: Bukti mutlak (dumpbin + biner debug)
        run: |
          set +e

          echo "=== (1) bangun biner DEBUG aplikasi lalu jalankan ==="
          cargo build -p arka-desktop --locked 2>&1 | tail -4
          ls -la target/debug/arka-agent.exe 2>&1
          echo "--- jalankan --help ---"
          ./target/debug/arka-agent.exe --help
          echo "debug --help rc=$?"
          echo "--- jalankan --status ---"
          ./target/debug/arka-agent.exe --status | head -c 400
          echo ""
          echo "debug --status rc=$?"

          echo "=== isi target & semua .exe/.dll ==="
          find target -maxdepth 4 \( -iname '*.exe' -o -iname '*.dll' \) -print 2>/dev/null

          python - <<'PY'
          import glob, os, subprocess

          def cari_dumpbin():
              pola = [r"C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe",
                      r"C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe"]
              for p in pola:
                  k = sorted(glob.glob(p))
                  if k: return k[-1]
              return None

          dumpbin = cari_dumpbin()
          print("dumpbin =", dumpbin)

          def dump(*args):
              if not dumpbin:
                  return ""
              try:
                  p = subprocess.run([dumpbin, "/nologo"] + list(args),
                                     capture_output=True, text=True, timeout=240)
              except Exception as e:
                  return "EXC %s: %s" % (type(e).__name__, e)
              return (p.stdout or "") + (p.stderr or "")

          def dependents(path):
              """DLL dari tabel impor FILE, bukan dari proses Python."""
              teks = dump("/dependents", path)
              hasil, ambil = [], False
              for b in teks.splitlines():
                  s = b.strip()
                  if s.lower().startswith("image has the following dependencies"):
                      ambil = True; continue
                  if ambil:
                      if not s: break
                      hasil.append(s.lower())
              return hasil, teks

          kandidat = []
          for pola in ("target/release/arka-agent.exe",
                       "target/debug/arka-agent.exe",
                       "target/debug/**/arka_agent-*.exe"):
              kandidat += sorted(glob.glob(pola, recursive=True))
          kandidat = list(dict.fromkeys(kandidat))

          semua = {}
          for p in kandidat:
              print("=" * 72)
              print("FILE:", p, os.path.getsize(p), "byte")
              d, mentah = dependents(p)
              semua[p] = d
              if d:
                  print("  %d DLL:" % len(d), ", ".join(d))
              else:
                  print("  dependents kosong. mentah:")
                  print("  " + mentah[:900].replace("\n", "\n  "))

          print("=" * 72)
          print("PERBANDINGAN DLL (biner rilis yang GAGAL vs yang lain):")
          rilis = semua.get("target/release/arka-agent.exe")
          if rilis:
              for p, d in semua.items():
                  if p == "target/release/arka-agent.exe" or not d: continue
                  hanya_rilis = sorted(set(rilis) - set(d))
                  hanya_lain  = sorted(set(d) - set(rilis))
                  print("  vs", p)
                  print("     hanya di RILIS :", hanya_rilis or "(sama)")
                  print("     hanya di lainnya:", hanya_lain or "(sama)")

          print("=" * 72)
          teks = dump("/imports", "target/release/arka-agent.exe")
          print("dumpbin /imports biner rilis (%d karakter):" % len(teks))
          print(teks[:4000])
          if len(teks) > 4000: print("...[dipotong]")
          low = teks.lower()
          for kunci in ("delay import", "delay-load", "summary"):
              idx = low.find(kunci)
              if idx >= 0:
                  print("--- bagian '%s' ---" % kunci)
                  print(teks[idx:idx+1200])
          PY

          echo "=== (uji beda) biner uji yang LULUS vs biner rilis ==="
          python - <<'PY'
          import glob, subprocess, os
          uji = sorted(glob.glob(os.path.join("target","debug","**","arka_agent-*.exe"), recursive=True))
          print("biner uji:", uji)
          for u in uji[:3]:
              try:
                  p = subprocess.run([u, "--list"], capture_output=True, text=True, timeout=60)
                  print(" ", os.path.basename(u), "rc=", p.returncode,
                        "out=", (p.stdout or "")[:120].replace("\n"," | "))
              except Exception as e:
                  print(" ", os.path.basename(u), type(e).__name__, e)
          PY
      - name: Diagnostik biner
        run: |
          python - <<'PY'
          import struct, ctypes, os, traceback
          def periksa(path):
              print("=====", path, "=====")
              data = open(path, "rb").read()
              if data[:2] != b"MZ":
                  print("BUKAN PE"); return
              e = struct.unpack_from("<I", data, 0x3C)[0]
              if data[e:e+4] != b"PE\0\0":
                  print("signature rusak:", data[e:e+4]); return
              coff = e + 4
              machine, nsec = struct.unpack_from("<HH", data, coff)
              optsz = struct.unpack_from("<H", data, coff+16)[0]
              opt = coff + 20
              magic = struct.unpack_from("<H", data, opt)[0]
              pe32p = magic == 0x20B
              num_dd = struct.unpack_from("<I", data, opt + (108 if pe32p else 92))[0]
              dd = opt + (112 if pe32p else 96)
              secs = []
              for i in range(nsec):
                  o = opt + optsz + i*40
                  vsz, va, rsz, ptr = struct.unpack_from("<IIII", data, o+8)
                  secs.append((va, vsz, ptr, rsz))
              def rva2off(rva):
                  for va, vsz, ptr, rsz in secs:
                      if va <= rva < va + max(vsz, rsz):
                          return ptr + (rva - va)
                  return None
              def cstr(off):
                  return data[off:off+128].split(b"\0")[0].decode("latin1", "replace")
              def read_dd(idx):
                  if idx >= num_dd: return (0, 0)
                  return struct.unpack_from("<II", data, dd + idx*8)
              def fungsi(iltrva):
                  out = []
                  off = rva2off(iltrva) if iltrva else None
                  if off is None: return out
                  while True:
                      ent = struct.unpack_from("<Q", data, off)[0]
                      if ent == 0: break
                      if ent & (1 << 63):
                          out.append(("#", ent & 0xFFFF))
                      else:
                          fo = rva2off(ent & 0x7FFFFFFF)
                          out.append(("n", cstr(fo + 2) if fo is not None else "?"))
                      off += 8
                  return out
              imp = []
              rva, _ = read_dd(1)
              off = rva2off(rva) if rva else None
              while off:
                  ilt, _, _, nrva, iat = struct.unpack_from("<IIIII", data, off)
                  if not (ilt or nrva or iat): break
                  imp.append((cstr(rva2off(nrva)), fungsi(ilt or iat)))
                  off += 20
              k32 = ctypes.WinDLL("kernel32")
              k32.GetProcAddress.restype = ctypes.c_void_p
              k32.GetProcAddress.argtypes = [ctypes.c_void_p, ctypes.c_void_p]
              for dll, fs in imp:
                  try:
                      h = ctypes.WinDLL(dll)
                  except OSError as ex:
                      print("  MUAT GAGAL:", dll, "->", ex); continue
                  kurang = []
                  for kind, val in fs:
                      if kind == "#":
                          addr = k32.GetProcAddress(h._handle, ctypes.c_void_p(val))
                      else:
                          buf = ctypes.create_string_buffer(val.encode("latin1"))
                          addr = k32.GetProcAddress(h._handle, ctypes.cast(buf, ctypes.c_void_p))
                      if not addr:
                          kurang.append(val if kind == "n" else "#%d" % val)
                  if kurang:
                      print("  TIDAK ADA FUNGSI di", dll, ":", kurang)
                  else:
                      print("  OK  %-40s %d fungsi" % (dll, len(fs)))
          for p in ("target/release/arka-agent.exe", "target/debug/arka-agent.exe"):
              if os.path.exists(p): periksa(p)
              else: print("tidak ada:", p)
          PY
          echo "=== jalankan via python (kode error Windows asli) ==="
          python - <<'PY'
          import subprocess, os
          for p in ("target/release/arka-agent.exe", "target/debug/arka-agent.exe"):
              if not os.path.exists(p): continue
              try:
                  r = subprocess.run([os.path.abspath(p), "--help"], capture_output=True, timeout=60)
                  print(p, "rc = 0x%08X" % (r.returncode & 0xFFFFFFFF), r.stdout[:200])
              except Exception as e:
                  print(p, type(e).__name__, e)
          PY

      - name: --status
        run: |
          ./target/release/arka-agent.exe --status | tee status.json
          grep -q '"shell": "powershell"' status.json
          grep -q '"workspace"' status.json
          # Versi tidak boleh kosong; kalau deteksi gagal, nilainya "".
          python - <<'PY'
          import json, sys
          data = json.load(open("status.json", encoding="utf-8"))
          print("terdeteksi:", data["message"])
          assert data["shell"] == "powershell", data["shell"]
          assert data["version"], "versi PowerShell kosong"
          assert data["workspace"].lower().endswith("workspace"), data["workspace"]
          assert data["workspace_exists"] is True, "workspace belum dibuat"
          PY

      - name: --prepare membuat workspace
        run: |
          ./target/release/arka-agent.exe --prepare | tee prepare.log
          grep -q "Siap" prepare.log
          test -f "$USERPROFILE/ArkaAgent/workspace/.arka/README.txt"

      - name: --exec membaca workspace
        run: |
          ./target/release/arka-agent.exe --exec "Get-ChildItem -Force | Select-Object -First 3" | tee exec.log
          grep -q "exit 0" exec.log

      - name: --exec output UTF-8 utuh
        run: |
          ./target/release/arka-agent.exe --exec "Write-Output '🚀 日本語 — é ñ'" | tee utf8.log
          grep -q "🚀" utf8.log
          grep -q "日本語" utf8.log
          grep -q "é ñ" utf8.log

      - name: --selftest (UTF-8, exit code native, Stop mematikan pohon proses)
        run: |
          ./target/release/arka-agent.exe --selftest | tee selftest.log
          grep -q "0 gagal" selftest.log

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Selftest shell Windows"
            echo '```'
            tail -20 selftest.log 2>/dev/null || echo "(log tidak tersedia)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
