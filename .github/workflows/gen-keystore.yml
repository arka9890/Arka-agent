name: Generate CI keystore (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Buat kunci CI bersama
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/ci-debug.keystore -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias arkaci -storepass arka1234 -keypass arka1234 \
            -dname "CN=Arka Agent CI, OU=Dev, O=Arka, L=Unknown, ST=Unknown, C=ID"
          keytool -list -v -keystore android/app/ci-debug.keystore \
            -storepass arka1234 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: ci-debug-keystore
          path: android/app/ci-debug.keystore
          retention-days: 1
