[package]
name = "arka-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arka Agent untuk Windows: shell PowerShell, secret store, UI egui (M3+)"

[[bin]]
name = "arka-agent"
path = "src/main.rs"

[dependencies]
arka_core = { path = "../arka-core" }
serde_json = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

# Dekode gambar untuk pratinjau (M6). Murni Rust, tanpa DLL eksternal —
# berbeda dengan pdfium/mupdf yang harus dibundel per arsitektur.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "ico",
] }

# Jumlah halaman PDF dibaca tanpa merender. `default-features = false` membuang
# rayon+chrono yang tidak dipakai di sini.
lopdf = { version = "0.47", default-features = false }

# egui/eframe: UI murni Rust, satu binary, tanpa WebView.
[dependencies.eframe]
version = "0.32"
default-features = false
features = [
    "glow",           # OpenGL; jalan di GPU lama & software (llvmpipe)
    "default_fonts",  # font bawaan + emoji sebagai fallback
    "persistence",    # simpan ukuran/posisi jendela + setelan UI
    "x11",            # Linux: untuk pengembangan UI (Xvfb) & CI
    "wayland",
]

# Hanya di-resolve saat target Windows. Di Linux/CI linux, crate ini tetap
# lolos `cargo check` tanpa dependensi Windows sama sekali.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # Menu tray & SW_SHOWNORMAL (platform.rs).
    "Win32_UI_WindowsAndMessaging",
    # Job Object: TerminateJobObject mematikan seluruh pohon proses.
    "Win32_System_JobObjects",
    # Dibutuhkan JOBOBJECT_EXTENDED_LIMIT_INFORMATION (memuat IO_COUNTERS).
    "Win32_System_Threading",
    # CreateJobObjectW memakai SECURITY_ATTRIBUTES.
    "Win32_Security",
    # GetLocalTime/GetSystemTime: selisih zona waktu untuk cap waktu chat.
    # (Keduanya ada di SystemInformation, bukan System\Time.)
    "Win32_System_SystemInformation",
    # CryptProtectData/CryptUnprotectData untuk enkripsi API key (M5).
    "Win32_Security_Cryptography",
    # ShellExecuteW ("buka dengan aplikasi lain") untuk berkas yang tidak bisa
    # dipratinjau di dalam aplikasi (M6).
    "Win32_UI_Shell",
    # M8: GetDiskFreeSpaceExW (ruang disk di tab Setelan).
    "Win32_Storage_FileSystem",
    # M8: pendaftaran AppUserModelID untuk toast (HKCU).
    "Win32_System_Registry",
    # M8: cegah sleep selama streaming (SetThreadExecutionState).
    "Win32_System_Power",
] }

# M8: toast Windows + tray icon. Keduanya HANYA di-resolve untuk target
# Windows; di Linux/CI tidak ada GTK/zbus yang ikut terkompilasi. `notify-rust`
# dimatikan fitur bawaannya agar tidak menarik zbus/dbus (khusus Unix) sama
# sekali, dan `tray-icon` tanpa `libxdo` (khusus Linux).
[target.'cfg(windows)'.dependencies.notify-rust]
version = "4.19"
default-features = false

[target.'cfg(windows)'.dependencies.tray-icon]
version = "0.21"
default-features = false

# Menu tray (muda) dipakai lewat re-export tray-icon, tapi id per item
# dibandingkan langsung → perlu dependency eksplisit.
[target.'cfg(windows)'.dependencies.muda]
version = "0.17"
default-features = false
# JANGAN aktifkan `common-controls-v6`: fitur ini mengganti dialog "About"
# bawaan muda dengan TaskDialogIndirect dari comctl32.dll versi 6. Tanpa
# manifest aplikasi yang mendeklarasikan Common-Controls v6, Windows memuat
# comctl32 v5 yang tidak mengekspor fungsi itu -> proses gagal start dengan
# 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND). Aplikasi memakai modal "Tentang"
# sendiri, jadi fitur ini tidak dibutuhkan.

# Dialog berkas OS (Impor / Simpan sebagai). Hanya dikompilasi di Windows —
# di Linux rfd akan mencari GTK/portal yang tidak ada, padahal UI dikembangkan
# di Linux tanpa GTK.
[target.'cfg(windows)'.dependencies.rfd]
version = "0.18"
default-features = false
# Sama seperti muda: `common-controls-v6` hanya dipakai rfd untuk MessageDialog
# (TaskDialogIndirect). Aplikasi hanya memakai FileDialog, jadi fitur ini
# sengaja dimatikan agar tidak mengimpor simbol comctl32 v6.
