[package]
name = "arka-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shim JNI + proot untuk aplikasi Android Arka Agent"

[lib]
# Nama file .so di jniLibs tetap `libarka_core.so` (dibaca
# `System.loadLibrary("arka_core")` di Arka.kt). build-android.sh menyalin
# hasil build ini dengan nama tersebut.
name = "arka_android"
crate-type = ["cdylib"]

[dependencies]
arka_core = { path = "../arka-core" }
jni = "0.21"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
